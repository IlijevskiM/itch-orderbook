name: ci
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        config:
          - { name: release, flags: "-DCMAKE_BUILD_TYPE=Release" }
          - { name: asan-ubsan, flags: "-DCMAKE_BUILD_TYPE=RelWithDebInfo -DFH_SANITIZE=ON" }
          - { name: tsan, flags: "-DCMAKE_BUILD_TYPE=RelWithDebInfo -DFH_TSAN=ON" }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.config.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build ${{ matrix.config.flags }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
